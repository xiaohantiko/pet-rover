<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>小车语音台架</title><style>
body{font:17px/1.65 system-ui,sans-serif;max-width:36rem;margin:2rem auto;padding:0 1rem;background:#faf9f5;color:#193127}h1{font-size:1.7rem}label,p,output{display:block;margin:.65rem 0}input[type=password],button{font:inherit;border:1px solid #799181;border-radius:.4rem;padding:.45rem .7rem}button{background:#e3ece5;margin:.25rem .15rem .25rem 0;cursor:pointer}button:disabled{opacity:.55}#talk{touch-action:none;user-select:none}audio{width:100%}output{min-height:1.8rem;font-weight:600}
</style><h1>小车语音台架</h1><p>半双工：同一时间只能听或说。对讲是松手后发送的一条短语音，不是实时电话。</p>
<label>本次连接口令 <input id="key" type="password" autocomplete="off" spellcheck="false"></label>
<button id="connect">连接并查看设备模式</button><p id="mode">未连接。默认不使用任何真实设备。</p>
<button id="tone" disabled>发送 0.35 秒测试音</button><button id="listen" disabled>取车端 2 秒音频</button>
<audio id="audio" controls preload="none"></audio>
<label><input id="consent" type="checkbox"> 允许本次使用手机麦克风，仅在我按住时取音</label>
<button id="talk" disabled>按住说话，松开发送（最长 4 秒）</button>
<output id="message" aria-live="polite">合成音模式可用于全流程测试，不必勾选手机麦克风。</output>
<script>
'use strict';
const byId=id=>document.getElementById(id), show=value=>byId('message').textContent=value;
let mode=null,active=null,lastUrl=null;
async function api(path,method='GET',body=null){
  const headers={Authorization:'Bearer '+byId('key').value};
  if(body)headers['Content-Type']='audio/wav';
  const response=await fetch('/api/'+path,{method,body,headers,cache:'no-store'});
  if(!response.ok)throw Error(response.status===409?'另一个人或另一操作正在使用设备，请稍后重试':response.status===401?'口令不正确':'请求失败：'+response.status);
  return response;
}
async function action(fn){try{await fn()}catch(error){show(error.message)}}
function syncControls(){for(const id of ['tone','listen'])byId(id).disabled=!mode;byId('talk').disabled=!mode||!byId('consent').checked}
function clearPreview(){const player=byId('audio');player.pause();player.removeAttribute('src');player.load();if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=null}
byId('key').oninput=()=>{mode=null;syncControls();clearPreview();byId('mode').textContent='口令已变，请重新连接。'};
byId('consent').onchange=()=>{if(!byId('consent').checked)finish(false);syncControls()};
byId('connect').onclick=()=>action(async()=>{mode=await(await api('status')).json();byId('mode').textContent='车端麦克风：'+(mode.mic==='ALSA'?'真实 ALSA':'合成测试音')+'；车端扬声器：'+(mode.speaker==='ALSA'?'真实 ALSA':'模拟接收（不会发声）');syncControls();show('已连接')});
function receipt(data){show((data.sink==='ALSA'?'交给真实扬声器':'模拟接收，不外放')+'：'+(data.frames/16000).toFixed(2)+' 秒')}
byId('tone').onclick=()=>action(async()=>{receipt(await(await api('tone','POST')).json())});
byId('listen').onclick=()=>action(async()=>{if(mode.mic==='ALSA'&&!confirm('现场人员均已同意？点击确定后，车端麦克风录制 2 秒。'))return;clearPreview();const blob=await(await api('listen','POST')).blob();lastUrl=URL.createObjectURL(blob);byId('audio').src=lastUrl;show('2 秒音频已到达，点播放器回听；关页即释放。')});
function pack(chunks,rate){
  const total=chunks.reduce((sum,chunk)=>sum+chunk.length,0),flat=new Float32Array(total);let offset=0;
  for(const chunk of chunks){flat.set(chunk,offset);offset+=chunk.length}
  const frames=Math.min(64000,Math.floor(total*16000/rate));
  if(frames<1600)throw Error('语音太短，请按住稍久一点');
  const buf=new ArrayBuffer(44+frames*2),view=new DataView(buf);
  function ascii(at,text){for(let index=0;index<text.length;index++)view.setUint8(at+index,text.charCodeAt(index))}
  ascii(0,'RIFF');view.setUint32(4,36+frames*2,true);ascii(8,'WAVE');ascii(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);ascii(36,'data');view.setUint32(40,frames*2,true);
  for(let index=0;index<frames;index++){const sample=flat[Math.floor(index*rate/16000)];view.setInt16(44+index*2,Math.round(Math.max(-1,Math.min(1,sample))*32767),true)}
  return new Blob([buf],{type:'audio/wav'});
}
function finish(send){
  const state=active;if(!state)return;active=null;clearTimeout(state.timer);
  if(state.processor){state.processor.onaudioprocess=null;state.processor.disconnect()}
  if(state.source)state.source.disconnect();if(state.stream)state.stream.getTracks().forEach(track=>track.stop());if(state.ctx)state.ctx.close().catch(()=>{});
  if(!send||!state.chunks.length){show('未发送');return}
  action(async()=>{receipt(await(await api('talk','POST',pack(state.chunks,state.rate))).json())});
}
async function start(){
  if(active||!mode||!byId('consent').checked)return;
  if(!window.isSecureContext||!navigator.mediaDevices){show('手机麦克风需要受信任的 HTTPS，电脑也可用 localhost。');return}
  const state={chunks:[]};active=state;state.timer=setTimeout(()=>finish(true),4000);
  try{
    state.ctx=new (window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();
    if(active!==state)return;
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true},video:false});
    if(active!==state){stream.getTracks().forEach(track=>track.stop());return}
    state.stream=stream;state.rate=state.ctx.sampleRate;state.source=state.ctx.createMediaStreamSource(stream);
    state.processor=state.ctx.createScriptProcessor(2048,1,1);
    state.processor.onaudioprocess=event=>{if(active===state)state.chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)))};
    state.source.connect(state.processor);state.processor.connect(state.ctx.destination);show('录音中，松手发送');
  }catch(error){if(active===state){finish(false);show('无法采集：'+error.message)}}
}
const talk=byId('talk');
talk.onpointerdown=event=>{if(event.button!==0)return;talk.setPointerCapture(event.pointerId);start()};
talk.onpointerup=()=>finish(true);talk.onpointercancel=()=>finish(false);talk.onlostpointercapture=()=>finish(false);
talk.onkeydown=event=>{if(event.key===' '&&!event.repeat){event.preventDefault();start()}};
talk.onkeyup=event=>{if(event.key===' '){event.preventDefault();finish(true)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)finish(false)});
window.addEventListener('pagehide',()=>{finish(false);clearPreview()});
</script></html>
