<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>寻宠小车 · 仿真台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#193735;background:#f4f5ef}*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:16px}h1{margin:6px 0 0}h2{font-size:1.05rem;margin:0 0 10px}p{line-height:1.6;margin:.4em 0}
.panel{padding:14px;margin:10px 0;background:white;border:1px solid #c5d2ce;border-radius:8px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas,.view{width:100%;height:auto;display:block}.view{aspect-ratio:560/260;background:#203b49}.caption{font-size:.88rem;color:#385653}
button{min-height:44px;font:inherit;padding:6px 15px;margin:2px;border:1px solid #adc4bd;border-radius:6px;background:#f5fbf8;color:#183934;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.stop{background:#9a3029;color:white;font-weight:700}
.pad{display:grid;max-width:290px;grid-template-columns:repeat(3,1fr);margin:.6em 0}.pad button{touch-action:none;user-select:none;-webkit-user-select:none}.status{font-variant-numeric:tabular-nums}.issue{color:#933004}li{margin:.4em 0}button:focus-visible{outline:3px solid #2a7d73}@media(max-width:610px){.views{grid-template-columns:1fr}}
</style>
<main>
<small>台架 / SIMULATOR ONLY</small><h1>寻宠小车</h1><p>这里是合成房间和虚拟镜头。按钮不驱动电机、不通电充电、不读取家庭摄像头。</p>
<div class="panel" aria-live="polite"><div class="status" id="status">连接中…</div><p id="note"></p><p class="issue" id="error"></p></div>
<div class="views"><section class="panel"><h2>合成视野</h2><img class="view" id="frame" alt="合成视野。场景内模拟猫可见时显示图标"><p class="caption">约每半秒刷新；不是真实视频或识别结果。</p></section>
<section class="panel"><h2>合成地图</h2><canvas id="map" width="390" height="270" role="img" aria-label="虚构室内占据地图；橙色为车，绿色为基座"></canvas><p class="caption">橙色是车头，绿色是基座。每格 0.5 m。</p></section></div>
<section class="panel"><h2>控制</h2><button data-action="claim">取得驾驶权</button><button data-action="release" data-driver>交还驾驶权</button><button class="stop" data-action="stop">急停（所有设备）</button><button data-action="reset" data-driver>解除急停</button>
<div class="pad"><span></span><button data-drive="forward" data-driver>前进</button><span></span><button data-drive="left" data-driver>左转</button><button data-drive="back" data-driver>后退</button><button data-drive="right" data-driver>右转</button></div>
<p class="caption">按住方向键移动，松开停车。电脑可用方向键。多个页面可观看，只有一位驾驶者。</p>
<button data-action="search" data-driver>寻找模拟猫</button><button data-action="home" data-driver>返回基座</button><button data-action="low" data-driver>注入低电测试</button><button data-action="capture" data-driver>截取当前帧</button></section>
<section class="panel"><h2>事件记录</h2><ol id="events"><li>暂无记录</li></ol><img id="shot" alt="所选事件的已保存合成画面" style="display:none;max-width:100%"></section>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const fragmentKey = new URLSearchParams(location.hash.slice(1)).get('key');
if (fragmentKey) { sessionStorage.setItem('benchKey', fragmentKey); history.replaceState({},'',location.pathname); }
const token = sessionStorage.getItem('benchKey') || '';
const client = Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2,'0')).join('');
const states = {idle:'待机',manual:'遥控中',search:'巡查中',return:'返航中',found:'已发现',not_found:'未发现',charging:'模拟充电',stopped:'急停锁定',fault:'故障',depleted:'电量耗尽'};
let mine = false, pressed = null, pulse = null, lastEvents = '', lastHeartbeat = 0, lastTime = -1;
const headers = {'Authorization':'Bearer ' + token,'X-Client':client};
function issue(message){byId('error').textContent=message}
async function api(path, body){
 const options={cache:'no-store',headers};
 if(body){options.method='POST';options.headers={...headers,'Content-Type':'application/json'};options.body=JSON.stringify(body)}
 const response=await fetch(path,options);
 if(!response.ok){throw new Error((await response.json()).error || String(response.status))}
 return response;
}
async function sendAction(action,value){
 try{
  const response=await api('/api/command',{action,value});
  issue('');draw(await response.json());return true;
 }catch(error){issue(error.message);return false}
}
const imageUrls = new Map();
async function loadImage(id, path){
 const image = byId(id), result = await api(path);
 const url = URL.createObjectURL(await result.blob());
 const prev=imageUrls.get(id);image.src=url;image.style.display='block';imageUrls.set(id,url);if(prev)URL.revokeObjectURL(prev);
}
function draw(state){
 if(state.t < lastTime)return;
 lastTime=state.t;mine=state.control==='mine';for(const button of document.querySelectorAll('[data-driver]'))button.disabled=!mine;
 byId('status').textContent = (states[state.mode]||state.mode)+' · '+state.battery+'% · '+state.room+' · '+({mine:'本机驾驶',busy:'其他设备驾驶',free:'可取得驾驶权'}[state.control]);
 byId('note').textContent = state.note;
 const canvas=byId('map'), ctx=canvas.getContext('2d'), unit=canvas.width/state.map[0].length;
 state.map.forEach((line,row)=>Array.from(line).forEach((symbol,col)=>{ctx.fillStyle=symbol==='#'?'#374b51':'#e8efec';ctx.fillRect(col*unit,row*unit,unit,unit)}));
 ctx.fillStyle='#59ac8e';ctx.fillRect((state.dock[0]+.1)*unit,(state.dock[1]+.1)*unit,unit*.8,unit*.8);
 ctx.save();ctx.translate(state.xy[0]*unit,state.xy[1]*unit);ctx.rotate(state.heading);ctx.fillStyle='#d56625';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-8,-7);ctx.lineTo(-8,7);ctx.fill();ctx.restore();
 const signature=state.events.map(item=>item.id).join(',')||'empty';
 if(signature!== lastEvents){lastEvents=signature; const list=byId('events');list.replaceChildren();
  if(!state.events.length){const li=document.createElement('li');li.textContent='暂无事件；可以截取一帧或启动寻宠。';list.append(li)}
  for(const item of state.events){const li=document.createElement('li'), btn=document.createElement('button');
   btn.textContent=new Date(item.utc).toLocaleString()+' · '+item.zone+' · '+item.label;
   btn.onclick=()=>loadImage('shot','/api/events/'+item.id).catch(err=>issue(err.message));li.append(btn);list.append(li)}
 }
}
for(const button of document.querySelectorAll('[data-action]'))button.onclick=async()=>{
 if(button.dataset.action==='stop'){const stopping=sendAction('stop');endDrive();await stopping;return}
 await endDrive();await sendAction(button.dataset.action)
};
let driveChain=Promise.resolve(), pending=false;
function drive(value){driveChain=driveChain.then(()=>sendAction('drive',value));return driveChain}
function beginDrive(value){
 if(!mine||pressed)return;
 pressed=value;
 const refresh=()=>{if(!pending && pressed===value){pending=true;drive(value).finally(()=>{pending=false})}};
 refresh();pulse=setInterval(refresh,150);
}
function endDrive(){
 if(!pressed)return Promise.resolve();
 pressed=null;clearInterval(pulse);return drive('neutral');
}
for(const button of document.querySelectorAll('[data-drive]')){
 button.onpointerdown=event=>{event.preventDefault();button.setPointerCapture(event.pointerId);beginDrive(button.dataset.drive)};
 button.onpointerup=endDrive;button.onpointercancel=endDrive;button.onlostpointercapture=endDrive;
}
const keys={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right'};
window.addEventListener('keydown',event=>{if(keys[event.key]&&mine){event.preventDefault();if(!event.repeat)beginDrive(keys[event.key])}});
window.addEventListener('keyup',event=>{if(keys[event.key]===pressed)endDrive()});
window.addEventListener('blur',endDrive);
document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrive()});
async function poll(){
 if(!token){issue('请使用终端打印的完整链接打开本页。');return}
 try{
  if(mine && !document.hidden && Date.now()-lastHeartbeat>1000){lastHeartbeat=Date.now();await sendAction('ping')}
  draw(await (await api('/api/state')).json());await loadImage('frame','/api/preview');
 }catch(error){issue(error.message);mine=false;for(const btn of document.querySelectorAll('[data-driver]'))btn.disabled=true}
 finally{setTimeout(poll,500)}
}
for(const button of document.querySelectorAll('[data-driver]'))button.disabled=true;
poll();
</script>
</html>
