[platformio]
default_envs = bench_monitor

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<bench.cpp>

[env:bench_monitor]

[env:raised_wheel_jog]
build_flags = ${env.build_flags} -D RAISED_WHEEL_JOG=1

[env:range_probe]
build_src_filter = +<range_probe.cpp>
lib_deps = pololu/VL53L1X@1.3.1

[env:ble_probe]
build_src_filter = +<ble_probe.cpp>

